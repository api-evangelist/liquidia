aid: liquidia
name: Liquidia
description: 'Liquidia Corporation (NASDAQ: LQDA) is a biopharmaceutical company focused
  on the development and commercialization of inhaled therapies for cardiopulmonary
  disease, specifically pulmonary arterial hypertension (PAH) and pulmonary hypertension
  associated with interstitial lung disease (PH-ILD). Its proprietary PRINT technology
  produces drug particles of uniform size and shape engineered for deep-lung deposition,
  and underpins YUTREPIA, its inhaled treprostinil dry powder product. Liquidia is
  also developing L606, a sustained-release liposomal treprostinil inhalation suspension
  partnered with Pharmosa Biopharm. Liquidia publishes no public developer portal,
  API, or machine-readable interface; this profile is catalogued for network identity,
  corporate transparency, and domain-security coverage only.'
